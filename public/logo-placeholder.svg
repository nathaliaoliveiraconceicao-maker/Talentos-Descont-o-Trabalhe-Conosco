<!--
  Logo da PLATAFORMA (não de um tenant específico) — usada no login e no
  painel /app/* antes de sabermos a qual empresa o usuário pertence, e no
  painel /superadmin/*. A logo de cada cliente (tenant) fica em
  tenants/{tenantId}.logoUrl e é exibida via TenantLogo.tsx nas páginas
  públicas "/{slug}/...". Substitua por uma marca oficial da plataforma
  quando disponível.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" role="img" aria-label="Plataforma de Recrutamento">
  <rect x="6" y="10" width="70" height="70" rx="18" fill="#146c94" />
  <path d="M24 34 h34 l-5 30 a5 5 0 0 1 -5 4 h-19 a5 5 0 0 1 -5 -4 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
  <circle cx="35" cy="76" r="4" fill="#ffffff" />
  <circle cx="59" cy="76" r="4" fill="#ffffff" />
  <path d="M18 34 h6" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <text x="92" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" fill="#124862">Talentos</text>
  <text x="92" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="13" letter-spacing="2" fill="#d32f2b">PLATAFORMA SAAS</text>
</svg>
