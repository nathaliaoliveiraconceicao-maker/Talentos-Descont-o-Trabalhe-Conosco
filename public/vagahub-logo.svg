<!--
  Logo da plataforma VagaHub (emblema + wordmark), conforme
  vagahub_apresentacao.pdf: emblema quadrado arredondado com gradiente
  azul vibrante -> lilás tecnológico, glifo branco de "check + nós
  conectados", e wordmark "VagaHub" (Vaga em azul-marinho, Hub em azul
  vibrante).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" role="img" aria-label="VagaHub">
  <defs>
    <linearGradient id="vagahubBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4169e1" />
      <stop offset="1" stop-color="#7c5cfc" />
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#vagahubBadge)" />
  <path d="M26 52 L40 68 L56 36" fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" />
  <path d="M56 36 L72 22" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="62" cy="32" r="4" fill="none" stroke="#ffffff" stroke-width="3" />
  <circle cx="72" cy="22" r="5" fill="#ffffff" />

  <text x="112" y="66" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700"
        font-size="50" letter-spacing="0.2">
    <tspan fill="#172554">Vaga</tspan><tspan fill="#4169e1">Hub</tspan>
  </text>
</svg>
